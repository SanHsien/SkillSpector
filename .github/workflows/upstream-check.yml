name: Upstream check

on:
  push:
    branches: [main]
    paths:
      - tools/check_upstream_updates.py
      - tools/upstream_baseline.json
      - .github/workflows/upstream-check.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # The checker shells out to `gh` for the upstream PR and issue lists, and
      # `gh` has no credentials in Actions unless one is handed to it. Without
      # this it cannot enumerate them and fails closed (exit 2), which reads as
      # "upstream check broken" rather than "token missing".
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Deliberately no --strict. With it, the job stays red for as long as any
      # upstream pull request or issue sits above the watermark -- and for a fork
      # that is level with upstream's main, that is the normal state, not an
      # incident: eight upstream PRs are open and no issue has been triaged yet.
      # A check that is red by construction is one people learn to scroll past.
      # Drift belongs in the job summary; the job itself fails only when the
      # checker could not run at all (exit 2: git fetch or gh enumeration failed),
      # which is the condition that actually needs someone's attention.
      - name: Check upstream
        id: upstream
        continue-on-error: true
        run: python tools/check_upstream_updates.py

      - name: Publish report
        if: always()
        run: cat upstream-review-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the check itself could not run
        if: steps.upstream.outcome == 'failure'
        run: |
          echo "::error::The upstream check could not complete (git fetch or gh enumeration failed). Review the workflow summary."
          exit 1
